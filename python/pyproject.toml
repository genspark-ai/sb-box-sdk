[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genspark-sbbox"
dynamic = ["version"]
description = "SB-Box Python SDK — cloud sandboxes for AI agents (Genspark)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://www.genspark.ai/sb-box"
Repository = "https://github.com/genspark-ai/sb-box-sdk"
Issues = "https://github.com/genspark-ai/sb-box-sdk/issues"
Documentation = "https://www.genspark.ai/sb-box/docs"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff"]

[tool.setuptools.dynamic]
version = {attr = "sbbox._version.__version__"}

[tool.setuptools.packages.find]
include = ["sbbox*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py39"

# Explicit rule set so every ruff version (local, CI) agrees
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sbbox"]
