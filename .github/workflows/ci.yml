name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # ubuntu-latest (26.04) ships no CPython 3.9 build; 22.04 has every supported version
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e . pytest ruff mypy build
      - run: ruff check . && ruff format --check .
      - run: mypy --strict sbbox examples
      - run: pytest -q
      - run: python -m build --wheel --sdist

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: typescript/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "stable"]
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}", cache: false }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -race
      - run: cd examples && go vet ./...

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features
        env: { RUSTDOCFLAGS: "-D warnings" }
      - run: cargo package --allow-dirty
